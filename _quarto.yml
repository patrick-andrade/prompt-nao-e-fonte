# Destinos por formato (CLI --output-dir):
#   quarto render 03-relatorio-qmd/mini-fiscal-monitor.qmd --to revealjs --output-dir outputs/revealjs-netlify/apresentacao
#   quarto render 03-relatorio-qmd/mini-fiscal-monitor.qmd --to pptx --output-dir outputs/pptx
#
# Deck de aula (instrutor; NÃO entra neste render: nem no Netlify):
#   quarto render aula/apresentacao-minicurso.qmd --profile aula --to revealjs
# O post-render executa scripts/achatar_saidas.py automaticamente.
#
# Demo Netlify: portal, Reveal.js executivo e painel estático (ver docs/roteiro-netlify.md).
project:
  type: default
  render:
    - 03-relatorio-qmd/mini-fiscal-monitor.qmd
  post-render:
    - python scripts/achatar_saidas.py

lang: pt-BR

execute:
  echo: false
  warning: false

format:
  revealjs:
    slide-level: 2
    output-file: index.html
  pptx: default
